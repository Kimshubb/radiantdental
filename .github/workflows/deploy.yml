name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Setup Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # Install Dependencies (Frontend Only)
      - name: Install Dependencies
        run: |
          cd client
          npm install

      # Build Frontend
      - name: Build Frontend
        run: |
          cd client
          CI=false npm run build
          ls -la build # Verify that the build folder exists

      # Deploy to DigitalOcean Server
      - name: Deploy to DigitalOcean
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: 46.101.154.184
          USER: root
        run: |
          # Create private key file
          echo "$SSH_PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem
          
          # Setup SSH known hosts
          mkdir -p ~/.ssh
          ssh-keyscan -H $HOST >> ~/.ssh/known_hosts
          
          # SSH into the server and deploy Radiant Dental
          ssh -i private_key.pem -o StrictHostKeyChecking=no $USER@$HOST << 'EOF'
            # Create the necessary directory if it doesn't exist
            mkdir -p /var/www/radiantdental/client

            # Navigate and pull latest code (optional, if you have Git on the server)
            cd /var/www/radiantdental
            git pull origin main
          EOF
          
          # Transfer the built frontend to the server
          scp -i private_key.pem -r frontend/build $USER@$HOST:/var/www/radiantdental/client
          
          # Restart Nginx to apply changes
          ssh -i private_key.pem -o StrictHostKeyChecking=no $USER@$HOST << 'EOF'
            sudo systemctl restart nginx
          EOF
